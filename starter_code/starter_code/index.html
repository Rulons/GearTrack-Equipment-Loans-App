<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GearTrack - Equipment Loans</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <header class="app-header">
        <h1>GearTrack Department Manager</h1>
    </header>

    <main class="dashboard">
        <section class="panel">
            <h2>Available Equipment</h2>
            <ul id="equipment-list" class="item-list"></ul>
        </section>

        <section class="panel">
            <h2>Active Loans</h2>
            <div id="active-loans-list" class="item-list"></div>
        </section>
    </main>

    <!-- GT-101: Checkout Equipment Modal -->
    <dialog id="checkout-modal" class="checkout-modal"
            aria-labelledby="checkout-title">

        <form id="checkout-form">
            <h2 id="checkout-title">Checkout Equipment</h2>

            <p id="checkout-equipment-name"></p>

            <input type="hidden" id="equipment-id">

            <label for="borrower-name">Borrower Name</label>
            <input
                type="text"
                id="borrower-name"
                autocomplete="name"
                required
            >

            <label for="borrower-email">Borrower Email</label>
            <input
                type="email"
                id="borrower-email"
                autocomplete="email"
                required
            >

            <label for="return-date">Return Date</label>
            <input
                type="date"
                id="return-date"
                required
            >

            <p id="checkout-error" role="alert" hidden></p>

            <div class="modal-actions">
                <button
                    type="button"
                    id="cancel-checkout"
                    class="btn btn-secondary">
                    Cancel
                </button>

                <button type="submit" class="btn">
                    Confirm Checkout
                </button>
            </div>
        </form>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>

</html>
